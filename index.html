<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <h1>Formulari d'inscripció</h1>
        <p>Activitats extraescolars - Curs 2026-2027</p>
    </header>
    <main>
        <form action="hola.html">
            <section>
                <h2>1. Dades personals</h2>
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom"  placeholder="Escriu el teu nom" required>

                <label for="cognom">Cognom</label>
                <input type="text" id="cognom" name="cognom" placeholder="Escriu els cognoms" required>

                <br>

                <label for="mail">Correu electrònic</label>
                <input type="email" id="mail" name="mail"  placeholder="exemple@correu.com" required>

                <br>

                <label for="phone-number">Telèfon</label>
                <input type="tel" id="phone-number" name="phone-number" minlength="9" maxlength="11" placeholder="600 000 000">

                <label for="data-naixement">Data de naixement</label>
                <input type="date" id="data-naixement" name="data-naixement" required>

                <br>

                <label for="password">Contrasenya</label>
                <input type="password" id="password" name="password" placeholder="Introdueix una contrasenya" required>

            </section>

            <section>

            </section>

            <section>

            </section>      
        </form>
    </main>
    <footer>
        <p>Model visual de referència. No cal que els botons enviïn informació ni que el formulari tingui conexió amb un servidor.</p>
    </footer>
</body>
</html>
